<title>Seleção de Perfil</title>
<style>
body {
  font-family: Arial, sans-serif;
}

.container {
  display: flex;
  gap: 15px;
}

input[type="radio"] {
  display: none;
}

.card {
  width: 120px;
  height: 100px;
  border: 2px solid #ccc;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.3s;
}

/* estado selecionado */
input[type="radio"]:checked + .card {
  border-color: #007bff;
  background-color: #e6f0ff;
  color: #007bff;
}

.card img {
  width: 40px;
  margin-bottom: 8px;
}
</style>
</head>
<body>

<h3 class="oi">Selecione o perfil</h3>

<div class="container">

  <label>
    <input type="radio" name="perfil">
    <div class="card">
      <img src="../Hemec/Images/fluent-emoji-high-contrast_wrench.png" alt="">
      <span>Eng. Biomédico</span>
    </div>
  </label>

  <label>
    <input type="radio" name="perfil">
    <div class="card">
      <img src="../Hemec/Images/lucide_hammer.png" alt="">
      <span>Técnico</span>
    </div>
  </label>

  <label>
    <input type="radio" name="perfil">
    <div class="card">
      <img src="../Hemec/Images/flowbite_clipboard-outline.png" alt="">
      <span>Gestor</span>
    </div>
  </label>

</div>
<div class="input-box">
    <img src="../Hemec/Images/carbon_locked.png" class="icon">
    <input type="password" placeholder="Senha">
</div>
<h3 class="ola">Digite sua senha</h3>
<button type="submit" class="botao">
        <a href="">Entrar no sistema</a>
</button>
<div class="linha">
    <hr>
    <span>Ou</span>
    <hr>
</div>
<div class="frases2">
    <p>Não possui uma conta?</p>
    <a href="../Hemec/Cadastro.html">Cadastre-se</a>
</div>
