<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hemec|Dashboad</title>
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <!-- MENU -->

    <aside class="sidebar">
      <!-- Logo -->
      <img src="/images-DEV-EV/logo.png" class="logo" alt="logo" />
      <hr>

      <!-- Menu Principal -->
      <nav class="menu-section">
        <span>PRINCIPAL</span>

        <a href="#" class="nav-dashboard">
          <img src="/images-DEV-EV/icone-1.png" alt="ICONE DASHBOARD" />
          <span>Dashboad</span>
        </a>

        <a href="/pages/equipamentos.html" class="nav-equipamentos">
          <img src="/images-DEV-EV/icone-2.png" alt="ICONE EQUIPAMENTOS" />
          <span>Equipamentos</span>
        </a>
      </nav>

      <!-- Menu Manutenção -->
      <nav class="menu-section" class="nav-manutencao">
        <span>MANUTENÇÃO</span>

        <a href="/pages/ordens-servico.html" class="nav-ordens-servico">
          <img src="/images-DEV-EV/icone-3.png" alt="ICONE ORDENS DE SERVIÇO" />
          <span>Ordens de Serviço</span>
        </a>

        <a href="/pages/manutencao-preventiva.html" class="nav-manut-prev">
          <img src="/images-DEV-EV/icone-4.png" alt="ICONE MANUTENÇÃO PREVENTIVA" />
          <span>Manutenção Preventiva</span>
        </a>
      </nav>

      <!-- Footer do Usuário -->
      <div class="sidebar-footer">
        <a href="/pages/perfil.html" class="nav-perfil">
          <div class="avatar">
            <img src="/images-DEV-EV/icone-5.png" alt="Avatar" />
               <!-- ESPERANDO BACKEND -->
            <span class="nome-paciente">Rafaela Lima</span>
          </div>
        </a>
        <a href="#" class="bt-navegacao" onclick="fazerLogout(event)">
          <img src="/images-DEV-EV/icone-6.png" alt="IMAGEM DE SAIR" />
        </a>
      </div>
    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <div class="conteudo-principal">
    <!--TOPO DA PÁGINA-->
        <div class="main-top">
            <span>Dashboard</span>
            <a href="/pages/Cadastro_equipamentos.html" class="bt-novo-equipamento">Novo Equipamento</a>
        </div>




         <!-- INDICADORES DOS EQUIPAMENTOS -->
    <div class="indicadores-equipamentos">
      <div class="total-equipamentos">
        <span class="titulo-indicador">TOTAL DE EQUIPAMENTOS</span>
        <!-- ESPERANDO BACKEND -->
        <span class="valor-indicador">150</span>
      </div>

      <div class="criticos">
        <span class="titulo-indicador">CRÍTICOS</span>
        <!-- ESPERANDO BACKEND -->
        <span class="valor-indicador">16</span>
        <span>Requerem ação imediata</span>
      </div>

      <div class="em-reparo">
        <span class="titulo-indicador">EM REPARO</span>
        <!-- ESPERANDO BACKEND -->
        <span class="valor-indicador">10</span>
        <span>Manutenção sendo feita</span>
      </div>

      <div class="conformidade">
        <span class="titulo-indicador">CONFORMIDADE</span>
        <!-- ESPERANDO BACKEND -->
        <span class="valor-indicador">85%</span>
      </div>
    </div>

<!-- CÓDIGO COMENTADO -->
    
    </div>
  </body>
</html>
