<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemec | Abrir chamado</title>
    <link rel="stylesheet" href="/css/abertura-chamado.css">
</head>
<body>
    <!-- MENU -->

    <aside class="sidebar">
      <!-- Logo -->
      <img src="/images-DEV-EV/logo.png" class="logo" alt="logo" />
      <hr>

      <!-- Menu Principal -->
      <nav class="menu-section">
        <span>PRINCIPAL</span>

        <a href="/pages/dashboard.html" class="nav-dashboard">
          <img src="/images-DEV-EV/icone-1.png" alt="ICONE DASHBOARD" />
          <span>Dashboad</span>
        </a>

        <a href="/pages/equipamentos.html" class="nav-equipamentos">
          <img src="/images-DEV-EV/icone-2.png" alt="ICONE EQUIPAMENTOS" />
          <span>Equipamentos</span>
        </a>
      </nav>

      <!-- Menu Manutenção -->
      <nav class="menu-section" class="nav-manutencao">
        <span>MANUTENÇÃO</span>

        <a href="#" class="nav-ordens-servico">
          <img src="/images-DEV-EV/icone-3.png" alt="ICONE ORDENS DE SERVIÇO" />
          <span>Ordens de Serviço</span>
        </a>

        <a href="/pages/manutencao-preventiva.html" class="nav-manut-prev">
          <img src="/images-DEV-EV/icone-4.png" alt="ICONE MANUTENÇÃO PREVENTIVA" />
          <span>Manutenção Preventiva</span>
        </a>
      </nav>

      <!-- Footer do Usuário -->
      <div class="sidebar-footer">
        <a href="/pages/perfil.html" class="nav-perfil">
          <div class="avatar">
            <img src="/images-DEV-EV/icone-5.png" alt="Avatar" />
               <!-- ESPERANDO BACKEND -->
            <span class="nome-paciente">Rafaela Lima</span>
          </div>
        </a>
        <a href="#" class="bt-navegacao" onclick="fazerLogout(event)">
          <img src="/images-DEV-EV/icone-6.png" alt="IMAGEM DE SAIR" />
        </a>
      </div>
    </aside>


     <!-- CONTEÚDO PRINCIPAL -->
    <div class="conteudo-principal">
    <!--TOPO DA PÁGINA-->
        <div class="main-top">
            <span>Abertura de Chamado</span>
            <a href="/pages/Cadastro_equipamentos.html" class="bt-novo-equipamento">Novo Equipamento</a>
        </div>



         <!-- CONTEINER DA ABERTURA -->
        <div class="conteiner-abertura">
    
            <!-- Badge da OS -->
            <span class="os-badge">#OS-2025-089</span>

    <!-- Linha 1: Equipamento e Setor -->
            <div class="form-row">
                <div class="form-group">
                    <label>EQUIPAMENTO</label>

                    <!-- ESPERANDO BACKEND -->
                    <select class="select-custom">
                        <option>Ventilador Mecânico VX-3000</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>SETOR</label>

                    <!-- ESPERANDO BACKEND -->
                    <select class="select-custom">
                        <option>UTI Adulto"</option>
                    </select>
                </div>
            </div>

             <!-- Linha 2: Criticidade -->
            <div class="form-group">
                <label>CRITICIDADE DO CHAMADO</label>
                <div class="criticidade-options">
            <!-- ESPERANDO BACKEND -->
                    <button class="criticidade-option selected-a">A</button>
            
            <!-- ESPERANDO BACKEND -->
                    <button class="criticidade-option option-b">B</button>
            
            <!-- ESPERANDO BACKEND -->
                    <button class="criticidade-option option-c">C</button>
                </div>
            </div>


            <!-- Linha 3: Descrição -->
            <div class="form-group">
                <label>DESCRIÇÃO DO PROBLEMA</label>
                <textarea class="textarea-problema" placeholder="Descreva o problema"></textarea>
            </div>
        </div>



    </div>
</body>
</html>
