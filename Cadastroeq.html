        <div class="palavras2">
        <img src="../Hemec/Images/streamline-ultimate_tool-box.png">
        <a href="">Equipamentos</a>
        </div>
        </div>
        <div class="palavras5">
        <h5>Manutenção</h5>
        </div>
        <div class="palavras3">
            <img src="../Hemec/Images/carbon_service-id.png">

            <div class="palavras4">
                <img src="../Hemec/Images/icon-park-outline_check-correct.png">

        </div>
        <div class="palavras6">
            <img src="../Hemec/Images/Ellipse 8.png">

        <div class="palavras7">
            <a href="../Hemec/Index.html">
            <img src="../Hemec/Images/Vector 5.png">

    <h2 class="frase">Cadastar Equipamento</h2>
    <div class="area1">
        <a color="white" href="../Hemec/Cadastroeq.html">Novo Equipamento</a>
    </div>
    <hr class="linha">
    <h3 class="frase2">Identificação do Equipamento</h3>
    <div class="input-box">
    <input type="number" placeholder="ID do Equipamento">
    </div>
    <div class="input-box">
    <input type="text" placeholder="Nome do Equipamento">
    </div>
    <div class="input-box">
    <input type="number" placeholder="Número de Série">
    </div>
    <div class="input-box2">
    <input type="date" placeholder="Data da Preventiva">
    </div>
    <div class="input-box2">
    <input type="text" placeholder="Setor">
    </div>
    <div class="input-box2">
    <input type="number" placeholder="Número Patrimonial">
    </div>
    <div class="input-box3">
    <input type="text" placeholder="Modelo">
    </div>
    <div class="input-box4">
    <input type="text" placeholder="Descrição do Equipamento">
    </div>
    <div class="container">
    <label>
    <input type="radio" name="Criticidade">
    <div class="card">
      <span>A</span>
      <span>Alta criticidade</span>
      <span>Risco de vida imediato</span>
    </div>
  </label>

  <label>
    <input type="radio" name="Criticidade">
    <div class="card">
      <span>B</span>
      <span>Média criticidade</span>
      <span>Impacto assistêncial indireto</span>
    </div>
  </label>

  <label>
    <input type="radio" name="Criticidade">
    <div class="card">
      <span>C</span>
      <span>Baixa criticidade</span>
      <span>Sem risco direto ao paciênte</span>
    </div>
  </label>
  </div>
  <h5 class="frase5">Criticidade</h5>
  <div class="container2">
    <label>
    <input type="radio" name="Frequência">
    <div class="card2">
      <span>Mensal</span>
    </div>
  </label>

  <label>
    <input type="radio" name="Frequência">
    <div class="card2">
      <span>Trimestral</span>
    </div>
  </label>
  </div>
  <div class="container3">
    <label>
    <input type="radio" name="Frequência">
    <div class="card3">
      <span>Semestral</span>
    </div>
  </label>

  <label>
    <input type="radio" name="Frequência">

 </div>
 <div class="area3">
